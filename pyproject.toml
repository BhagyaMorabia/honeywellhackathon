[project]
name = "sentinelflow"
version = "1.0.0"
description = "AI-Powered Behavioral Anomaly Detection for Cybersecurity"
requires-python = ">=3.10"
authors = [
    { name = "SentinelFlow Team" }
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
